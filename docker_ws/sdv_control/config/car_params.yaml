/**:
  ros__parameters:
    frequency: 100
    # init_pose: [-5.0, 5.0, 0.0] # x, y, psi
    init_pose: [-64.4, -94.2, 3.1415] # x, y, psi
    # init_pose: [0.0,0.0,0.0] # x, y, psi
    parent_frame: "odom"
    child_frame: "base_link"

# First Order Feedback Linearization 1-DOF PID Controller for the VTec SDC1
sdc1_vel_pid_node:
  ros__parameters:
    Kp: 1.0
    Ki: 0.01
    Kd: 0.2 #0.01
    D_MAX: 180

# First Order Feedback Linearization 1-DOF ASMC Controller for the VTec SDC1
sdc1_vel_asmc_node:
  ros__parameters:
    lambda1: 1.0
    lambda2: 1.0
    K2: 1.0
    K_alpha: 1.0
    K1_init: 0.0
    K_min: 0.0
    mu: 0.01
    D_MAX: 180

# Stanley Controller Params
stanley_controller_node:
  ros__parameters:
    K: 1.0 # drives you to path faster, induces overshoot
    K_soft: 1.5 # softens overshoot
    # DELTA_SAT: [0.467503, -0.309027] # radians
    DELTA_SAT: [0.3722,-0.3722] # radians