/**:
  ros__parameters:
    init_pose: [-5.0, 5.0, 1.5704] # x, y, psi

# First Order Feedback Lineari  zation 1-DOF PID Controller for the VTec SDC1
sdc1_vel_pid_node:
  ros__parameters:
    Kp: 10.0
    Ki: 0.01
    Kd: 0.0 #0.01
    D_MAX: 180

# Stanley Controller Params
stanley_controller_node:
  ros__parameters:
    K: 1.0 # drives you to path faster, induces overshoot
    K_soft: 1.0 #softens overshoot
    DELTA_SAT: [-0.5497787, 0.4101524] # radians